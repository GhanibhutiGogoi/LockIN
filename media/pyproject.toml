[project]
name = "lockin-media"
version = "0.1.0"
description = "LockIn narration, captions, and offline video library"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<0.29",
  "pydantic-settings>=2.8,<3",
  "filelock>=3.18,<4",
  "msgpack>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "huggingface-hub>=0.30,<2",
]

[project.scripts]
lockin-media = "lockin_media.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lockin_media"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
