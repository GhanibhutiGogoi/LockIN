<!doctype html><html lang="en"><meta charset="utf-8"><title>LockIN worker smoke test</title><body>
<h1>Real pretrained-model smoke test</h1>
<p>Public fixture only. No webcam access. Add the OpenCV lena.jpg test image at public/.qa/face.jpg before running.</p>
<button id="run">Run real model</button><pre id="log">Idle</pre>
<script type="module">
const log = document.querySelector('#log');
const print = s => { log.textContent += '\n' + s; };
document.querySelector('#run').onclick = async () => {
  log.textContent = 'Loading model…';
  const worker = new Worker('/gaze-worker.js');
  const canvas = document.createElement('canvas'); canvas.width = 640; canvas.height = 480;
  const ctx = canvas.getContext('2d', {willReadFrequently: true});
  let phase = 'face', image, pointIndex = 0, nextFrame;
  const points = [[0,0],[-.3,-.3],[0,-.3],[.3,-.3],[.3,0],[.3,.3],[0,.3],[-.3,.3],[-.3,0]];
  let timer = setTimeout(() => { print('FAIL: timeout'); worker.terminate(); }, 120000);
  const fail = s => { print('FAIL: ' + s); clearTimeout(timer); worker.terminate(); };
  worker.onerror = e => fail(e.message);
  const sendFrame = () => { const f = ctx.getImageData(0,0,640,480); worker.postMessage({type:'frame',buffer:f.data.buffer,width:640,height:480,timestamp:performance.now()},[f.data.buffer]); };
  const beginPoint = () => {
    clearTimeout(nextFrame);
    const [x,y] = points[pointIndex];
    ctx.fillStyle = '#aaa'; ctx.fillRect(0,0,640,480);
    ctx.drawImage(image,80+x*100,y*70,480,480);
    worker.postMessage({type:'point',point:{index:pointIndex,x,y,validation:false}});
    nextFrame = setTimeout(sendFrame,100);
  };
  worker.onmessage = async ({data}) => {
    if (data.type === 'ready') {
      print('READY: '+data.backend);
      image = new Image(); image.src = '/.qa/face.jpg';
      try { await image.decode(); } catch { fail('missing fixture'); return; }
      ctx.fillStyle = '#aaa'; ctx.fillRect(0,0,640,480); ctx.drawImage(image,80,0,480,480);
      sendFrame();
    } else if (data.type === 'result') {
      if (phase === 'face') {
        print(JSON.stringify(data));
        if (!data.face || !data.eyesOpen || !data.features || !data.gaze?.every(Number.isFinite)) { fail('face inference invalid'); return; }
        print('PASS: real face yields finite gaze and geometry');
        phase = 'blank'; ctx.fillStyle = '#000'; ctx.fillRect(0,0,640,480); sendFrame();
      } else if (phase === 'blank') {
        print(JSON.stringify(data));
        if (data.face || data.gaze !== null || data.features !== null) { fail('blank frame misclassified'); return; }
        print('PASS: blank frame yields unknown, not centre gaze');
        print('Starting fixture-only calibration integration (not an accuracy test)…');
        phase = 'calibration'; beginPoint();
      } else if (phase === 'calibration') {
        nextFrame = setTimeout(sendFrame,100);
      } else if (phase === 'reset-check') {
        if (!data.face || !data.gaze?.every(Number.isFinite)) { fail('post-reset inference invalid'); return; }
        print('PASS: calibration reset preserves working pretrained model');
        print('ALL MODEL SMOKE CHECKS PASSED'); clearTimeout(timer); worker.terminate();
      }
    } else if (data.type === 'pointDone') {
      print('Captured calibration point '+(data.index+1));
      pointIndex++;
      if (pointIndex < points.length) beginPoint();
      else { clearTimeout(nextFrame); phase = 'fitting'; worker.postMessage({type:'fit'}); }
    } else if (data.type === 'fitted') {
      if (data.baseline.length < 63) { fail('missing baseline samples'); return; }
      print('PASS: 9-point affine calibration completed, '+data.baseline.length+' baseline samples');
      worker.postMessage({type:'reset'});
    } else if (data.type === 'resetDone') {
      phase = 'reset-check'; sendFrame();
    } else if (data.type === 'error') fail(data.message);
  };
  worker.postMessage({type:'init',baseUrl:location.origin+'/'});
};
</script></body></html>
